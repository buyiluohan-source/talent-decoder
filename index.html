<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职场潜能与天赋能量场评估</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            text-align: center;
            margin-bottom: 24px;
        }

        .progress-bar {
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-inner {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .option-btn:hover {
            background-color: var(--primary);
            border-color: var(--primary-hover);
        }

        .result-box {
            text-align: center;
        }

        .result-badge {
            display: inline-block;
            padding: 6px 16px;
            background-color: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .result-type {
            font-size: 2rem;
            font-weight: 800;
            color: #a5b4fc;
            margin-bottom: 16px;
        }

        .result-desc {
            font-size: 0.95rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 24px;
            text-align: left;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 8px;
        }

        footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--text-sub);
            text-align: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">潜能解码评估</h1>
        <p class="subtitle">洞察你的核心优势与潜能能量场</p>

        <div id="progress-container" class="progress-bar hidden">
            <div id="progress-inner" class="progress-inner"></div>
        </div>

        <!-- 1. 前置身份选择页 -->
        <div id="role-select-step">
            <div class="question-title">请选择你当前的身份形态：</div>
            <div class="options-group">
                <button class="option-btn" onclick="selectRole('student')">
                    🎓 <strong>在校生</strong>（含本科、硕士、博士生）
                </button>
                <button class="option-btn" onclick="selectRole('worker')">
                    💼 <strong>职场青年</strong>（入职/创业/自由职业）
                </button>
            </div>
        </div>

        <!-- 2. 答题区域 -->
        <div id="quiz-step" class="hidden">
            <div id="question-text" class="question-title"></div>
            <div id="options-container" class="options-group"></div>
        </div>

        <!-- 3. 结果页面 -->
        <div id="result-step" class="result-box hidden">
            <span class="result-badge">你的天赋潜能主导类型</span>
            <div id="result-type" class="result-type"></div>
            <div id="result-desc" class="result-desc"></div>
            <button class="option-btn" style="text-align:center; width:100%; margin-top:10px;" onclick="location.reload()">重新测试</button>
        </div>
    </div>

    <footer>
        <p>Powered by AlphaLab Internal</p>
    </footer>

    <script>
        // Supabase 配置（替换为你的实际地址与 Anon Key）
        const SUPABASE_URL = 'https://czctjtuhuuxjctyglkga.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6Y3RqdHVodXV4amN0eWdsa2dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MDc4NTMsImV4cCI6MjEwNzI4Mzg1M30.BQqmTHkBrjIqP_FyUVF-lxI4QyhJ5PU5Vag0wMFQPXs'; // 请替换为你真实的 key
        
        let supabaseClient = null;
        if (typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // 双轨题库设计
        const quizBank = {
            student: [
                {
                    q: "Q1. 距离期末大项目/论文开题截止只剩三天，导师要求突然大改方向，你会？",
                    options: [
                        { text: "A. 迅速重新规划每小时的攻坚进度", type: "A" },
                        { text: "B. 先拉组员/同学吐槽抱团，分摊压力", type: "B" },
                        { text: "C. 灵光一现，觉得新方向更有意思直接发散创意", type: "C" },
                        { text: "D. 翻出规范文档和模版，稳扎稳打重构", type: "D" }
                    ]
                },
                {
                    q: "Q2. 在小组合作课题中，组员意见不一、进度拖沓，你通常会？",
                    options: [
                        { text: "A. 强力推导核心逻辑，把任务强行往下推进", type: "A" },
                        { text: "B. 居中调停，照顾大家情绪重新凝聚团队", type: "B" },
                        { text: "C. 承包最需要脑洞的部分，负责创新与视觉", type: "C" },
                        { text: "D. 承担统筹和文档整理，确保按时交付", type: "D" }
                    ]
                },
                {
                    q: "Q3. 在校园或科研生活中，什么最让你有成就感？",
                    options: [
                        { text: "A. 独立攻克极其复杂的学术/算法难题", type: "A" },
                        { text: "B. 组织了一场非常成功、大家很嗨的社团活动", type: "B" },
                        { text: "C. 完成了一篇视角独特的论文或设计作品", type: "C" },
                        { text: "D. 把复习资料梳理得极其井井有条", type: "D" }
                    ]
                },
                {
                    q: "Q4. 面对一个完全没涉猎过的竞赛或领域，你会？",
                    options: [
                        { text: "A. 兴奋！直接查英文文献边试错边推进", type: "A" },
                        { text: "B. 找参加过的学长学姐打听经验，找靠谱搭档", type: "B" },
                        { text: "C. 太好了，正好可以打破常规套路玩点新的", type: "C" },
                        { text: "D. 先拉备战时间表和资料清单，稳扎稳打", type: "D" }
                    ]
                },
                {
                    q: "Q5. 高强度科研/学习了一整周后，周末你如何“回血”？",
                    options: [
                        { text: "A. 复盘个人目标，制定下周高效计划", type: "A" },
                        { text: "B. 约三五好友聚餐、轰趴，在互动中补充能量", type: "B" },
                        { text: "C. 沉浸在音乐、看展或手作等个人灵感世界", type: "C" },
                        { text: "D. 彻底大扫除、洗衣服，重塑生活秩序感", type: "D" }
                    ]
                }
            ],
            worker: [
                {
                    q: "Q1. 周五下班前 10 分钟，客户紧急提出要大改方案，你的第一反应是？",
                    options: [
                        { text: "A. 重新拆解关键节点，迅速分工拆单", type: "A" },
                        { text: "B. 先安抚团队情绪，开会把压力分摊", type: "B" },
                        { text: "C. 跳出旧框架，抛出一个全新的替代大方案", type: "C" },
                        { text: "D. 翻看备份和模版，用最稳妥的流程快速填坑", type: "D" }
                    ]
                },
                {
                    q: "Q2. 在分歧严重、各执一词的跨部门会议上，你扮演的角色是？",
                    options: [
                        { text: "A. 用数据和事实说话，指出哪条路线 ROI 最高", type: "A" },
                        { text: "B. 察言观色，找准利益诉求平息尴尬情绪", type: "B" },
                        { text: "C. 提出一个谁都没想到的新视角打破僵局", type: "C" },
                        { text: "D. 梳理讨论要点，确认落地细节与风险控制", type: "D" }
                    ]
                },
                {
                    q: "Q3. 最能让你感到工作成就感爆棚的时刻是？",
                    options: [
                        { text: "A. 攻克了一个大家都搞不定的硬核业务难题", type: "A" },
                        { text: "B. 理顺了合作关系，获得跨部门一致好评", type: "B" },
                        { text: "C. 构想的创新产品/策划得到了完美的呈现场景", type: "C" },
                        { text: "D. 项目按计划完美推进，零失误、零延迟落地", type: "D" }
                    ]
                },
                {
                    q: "Q4. 领导给你派了一个完全没接触过的全新业务方向，你会？",
                    options: [
                        { text: "A. 兴奋！立刻拆解目标边做边迭代", type: "A" },
                        { text: "B. 先找领域专家或前辈请教，借力破局", type: "B" },
                        { text: "C. 不受老套路束缚，大胆尝试全新玩法", type: "C" },
                        { text: "D. 建立了工作对照表，把踩坑风险提前排查", type: "D" }
                    ]
                },
                {
                    q: "Q5. 经过极其消耗精力的一周高压工作，周末你怎么恢复能量？",
                    options: [
                        { text: "A. 梳理本周成果，把下周计划制定清晰", type: "A" },
                        { text: "B. 约朋友聚会聊天，在社交中释放压力", type: "B" },
                        { text: "C. 独处探索灵感，做自己感兴趣的小项目", type: "C" },
                        { text: "D. 整理房间、制定健康计划，找回掌控感", type: "D" }
                    ]
                }
            ]
        };

        // 解读结果配置
        const resultProfiles = {
            "A": {
                name: "破局者 (Strategist)",
                desc: "你拥有极强的目标导向与逻辑推演能力。面对复杂多变的环境，你能迅速抓取核心矛盾并强力推进，是天然的攻坚手与战略解题人。"
            },
            "B": {
                name: "连接者 (Connector)",
                desc: "你具备高超的情绪感知与资源整合能力。你善于搭建人与人之间的信任桥梁，抚平团队摩擦，是组织不可或缺的超级润滑剂与能量枢纽。"
            },
            "C": {
                name: "造物者 (Creator)",
                desc: "你的思维不受传统框架限制，拥有敏锐的直觉与丰富的创造力。你总能为死板的项目注入灵感火花，擅长从 0 到 1 打造令人惊艳的独特产物。"
            },
            "D": {
                name: "掌舵者 (Organizer)",
                desc: "你稳重细致，对风险和秩序有极其天然的掌控力。无论前线如何波谲云诡，你总能确保后方流程的规范落地，是团队最放心的定海神针。"
            }
        };

        // 状态变量
        let selectedRole = '';
        let currentQuestions = [];
        let currentIndex = 0;
        let userAnswers = [];

        // 选择身份
        function selectRole(role) {
            selectedRole = role;
            currentQuestions = quizBank[role];
            
            document.getElementById('role-select-step').classList.add('hidden');
            document.getElementById('quiz-step').classList.remove('hidden');
            document.getElementById('progress-container').classList.remove('hidden');
            
            renderQuestion();
        }

        // 渲染题目
        function renderQuestion() {
            const qData = currentQuestions[currentIndex];
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // 更新进度条
            const progressPct = ((currentIndex) / currentQuestions.length) * 100;
            document.getElementById('progress-inner').style.width = `${progressPct}%`;

            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => handleAnswer(opt.type);
                optionsContainer.appendChild(btn);
            });
        }

        // 记录答案与推进
        function handleAnswer(type) {
            userAnswers.push(type);
            currentIndex++;

            if (currentIndex < currentQuestions.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        // 计算结果与展示
        async function showResult() {
            document.getElementById('quiz-step').classList.add('hidden');
            document.getElementById('progress-container').classList.add('hidden');
            document.getElementById('result-step').classList.remove('hidden');

            // 统计出现频率最多的类型
            const counts = { A: 0, B: 0, C: 0, D: 0 };
            userAnswers.forEach(t => counts[t] = (counts[t] || 0) + 1);
            
            let finalType = 'A';
            let maxCount = -1;
            for (let k in counts) {
                if (counts[k] > maxCount) {
                    maxCount = counts[k];
                    finalType = k;
                }
            }

            const profile = resultProfiles[finalType];
            document.getElementById('result-type').innerText = profile.name;
            document.getElementById('result-desc').innerText = profile.desc;

            // 组合上报数据
            const answerPathStr = `[身份:${selectedRole === 'student' ? '在校生' : '职场青年'}] ` + userAnswers.join(',');
            
            // 数据自动上报 Supabase
            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient
                        .from('quiz_results')
                        .insert([
                            { 
                                answers: answerPathStr, 
                                result_type: profile.name 
                            }
                        ]);
                    if (error) {
                        console.error('上报失败:', error);
                    } else {
                        console.log('数据自动上报成功！');
                    }
                } catch (e) {
                    console.error('上报异常:', e);
                }
            }
        }
    </script>
</body>
</html>
